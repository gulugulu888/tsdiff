# unconditional-time-series-diffusion/configs/fdr/train_CAS_250L.yaml

# highlight-start
dataset: "D:/FDR_TS_PREDICT/unconditional-time-series-diffusion/data/processed_fdr_interactive/CAS_origrate_filtByCAS30p0units" # <--- THIS IS THE MOST IMPORTANT CHANGE
# highlight-end
freq: "250L"                     # This matches your output

# 模型架构和扩散参数
model: unconditional
diffusion_config: diffusion_small_config 
normalization: mean                 
use_features: False                 
use_lags: True                      
init_skip: True                     

# 训练超参数
context_length: 240              # This was in your YAML
prediction_length: 40               # This was in your YAML

lr: 1.e-4                           
gradient_clip_val: 0.5
max_epochs: 30                     
# Based on your setup output: 456 training series.
# If batch_size is 16: 456 / 16 = 28.5. So, 28 or 29 batches per epoch.
# You have 64, which means each epoch will cycle through the data ~2.25 times. This is fine.
num_batches_per_epoch: 64           
batch_size: 16                      

# 验证回调中的采样器设置 (如果使用 EvaluateCallback)
sampler: ddpm                       
sampler_params:
  guidance: quantile              
  scale: 4.0                      
num_samples_val_callback: 16      

# 训练过程控制
use_validation_set: True            
use_evaluate_callback: True         
eval_every: 20                      
device: cuda:0                      
setup: forecasting
do_final_eval: True                 
save_top_k_checkpoints: 3